# GLM-5.3-UNCENSORED-FP8 (dealignai/GLM-5.3-UNCENSORED-FP8) in FP8, on the
# glm5.3 family. This is a different HF repo than the one metadata.yaml names
# (nvidia/GLM-5.3-NVFP4), so model.localPath is set explicitly: the site
# profile would otherwise derive the NVFP4 path from source.hf.
apiVersion: catalog.swiss/v1
name: glm5.3
version: 1.0.5
servedName: glm5.3-uncensored-fp8
variants:
  - id: sglang-tp8-pp2-h100
    default: true
    description: >-
      TP8 per pod, PP2 across two H100 nodes as a leader-worker group, 16 GPUs
      total, on FP8 weights.
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.9"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.18-cu129
    requires:
      gpus: 8 # per pod; 16 across the group
      nodes: 2
      topology: lws
      rdma: true
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        localPath: /mnt/disk0/models/GLM-5.3-UNCENSORED-FP8
        mountPath: /model
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      lws:
        enabled: true
        size: 2
      rdma:
        enabled: true
      extraArgs:
        - --tp-size=8
        - --pp-size=2
        - --dist-timeout=1800
        - --chunked-prefill-size=16384
        - --max-prefill-tokens=16384
        - --max-running-requests=32
        - --cuda-graph-max-bs-decode=32
        - --disable-overlap-schedule
        - --disable-custom-all-reduce
        - --trust-remote-code
        - --mem-fraction-static=0.85
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=glm45
        - --tool-call-parser=glm47
        - --tokenizer-worker-num=4
      env:
        - name: NCCL_DEBUG
          value: WARN
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_NET_GDR_LEVEL
          value: "2"
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dot-cache
          mountPath: /root/.cache
      resources:
        requests:
          ephemeral-storage: 28Gi
        limits:
          ephemeral-storage: 28Gi
      service:
        port: 8050
      progressDeadlineSeconds: 3600
      startupProbe:
        httpGet:
          path: /v1/models
          port: http
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 160
      readinessProbe:
        httpGet:
          path: /v1/models
          port: http
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
