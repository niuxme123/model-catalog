# Variant from the preserved modelforge build (distilled, 1M context),
# served as "modelforge-05". metadata.yaml's source.hf names the upstream
# Qwen weights, so model.localPath is set explicitly instead of being
# derived from source.hf. Tuned over sglang-tp1-b300: fp8 KV cache, lpm
# scheduling, larger prefill budget.
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3.6-35b-a3b
id: sglang-tp1-b300-v2
version: 1.0.0
servedName: modelforge-05
description: >-
  TP1 on a single B300 GPU, single node, distilled 1M-context modelforge
  build, fp8 KV cache, lpm schedule policy, mamba extra_buffer cache
  strategy.
engine: sglang
chart:
  name: sglang
  version: ">=0.7.1"
image:
  repository: harbor.4pd.io/hardcore-tech/sglang
  tag: v0.5.19
requires:
  gpus: 1
  topology: single-node
  gpuProduct:
    - NVIDIA-B300-SXM6-AC
values:
  model:
    localPath: /mnt/disk0/models/modelforge/preserved-2900
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=1
    - --enable-metrics
    - --kv-cache-dtype=fp8_e4m3
    - --schedule-policy=lpm
    - --reasoning-parser=qwen3
    - --tool-call-parser=qwen3_coder
    - --max-prefill-tokens=65536
    - --enable-cache-report
    - --mem-fraction-static=0.9
    - --chunked-prefill-size=16384
    - --mamba-radix-cache-strategy=extra_buffer
    - --stream-response-default-include-usage
  env:
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
