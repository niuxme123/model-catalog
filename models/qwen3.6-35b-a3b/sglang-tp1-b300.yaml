# Variant from the modelforge Qwen3.6-35B-A3B-793303 build, served as "kimi".
# metadata.yaml's source.hf names the upstream Qwen weights, so
# model.localPath is set explicitly instead of being derived from source.hf.
# Mirrored from the docker run deploy (sglang v0.5.19, port 8050).
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3.6-35b-a3b
id: sglang-tp1-b300
version: 1.0.0
servedName: kimi
description: >-
  TP1 on a single B300 GPU, single node, modelforge build
  (Qwen3.6-35B-A3B-793303), mamba extra_buffer cache strategy.
engine: sglang
chart:
  name: sglang
  version: ">=0.7.1"
image:
  repository: harbor.4pd.io/hardcore-tech/sglang
  tag: v0.5.19
requires:
  gpus: 1
  topology: single-node
  gpuProduct:
    - NVIDIA-B300-SXM6-AC
values:
  model:
    localPath: /mnt/disk0/models/modelforge/Qwen3.6-35B-A3B-793303
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=1
    - --mamba-radix-cache-strategy=extra_buffer
    - --chunked-prefill-size=16384
    - --mem-fraction-static=0.9
    - --enable-cache-report
    - --enable-metrics
    - --stream-response-default-include-usage
    - --reasoning-parser=qwen3
    - --tool-call-parser=qwen3_coder
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
