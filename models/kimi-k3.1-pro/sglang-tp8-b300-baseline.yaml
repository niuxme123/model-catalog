# Mirrored from the docker run deploy (sglang dev-kimi-k31-pro image, port
# 30000) on a single eight-GPU B300 node.
apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3.1-pro
id: sglang-tp8-b300-baseline
version: 1.0.0
servedName: kimi-k3.1-pro
description: >-
  TP8 with DCP8 (fi_a2a comm backend) and EP2 on eight B300 GPUs, single
  node, mamba full-memory ratio 3.63, multithreaded weight loading.
engine: sglang
chart:
  name: sglang
  version: ">=0.7.1"
image:
  repository: harbor.4pd.io/hardcore-tech/sglang
  tag: dev-kimi-k31-pro
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
    - NVIDIA-B300-SXM6-AC
values:
  cache:
    enabled: true
    historyLimit: 2
    maxSlotsPerNode: 1
  model:
    localPath: /mnt/disk0/models/Kimi-K3.1-Pro
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --trust-remote-code
    - --tp-size=8
    - --dcp-size=8
    - --dcp-comm-backend=fi_a2a
    - --ep-size=2
    - --mem-fraction-static=0.85
    - --max-running-requests=64
    - --weight-loader-prefetch-checkpoints
    - '--model-loader-extra-config={"enable_multithread_load": true}'
    - --mamba-full-memory-ratio=3.63
    - --reasoning-parser=kimi_k3
    - --tool-call-parser=kimi_k3
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: SGLANG_DCP_PUSH_COMBINE_MAX_ROWS
      value: "1536"
    - name: SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB
      value: "32768"
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  service:
    port: 30000
  progressDeadlineSeconds: 3600
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
