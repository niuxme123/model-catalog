# GLM-5.3-Flash uncensored FP8 (local path GLM-5.3-Flash-UNCENSORED-FP8,
# likely dealignai/GLM-5.3-Flash-UNCENSORED-FP8) on a single H100 node.
# metadata.yaml's source.hf names the official zai-org/GLM-5.3-Flash repo, so
# model.localPath is set explicitly instead of being derived from source.hf.
# Mirrored from the deploy.sh docker run (sglang v0.5.20-video, video input
# verified via /v1/chat/completions with a video_url message).
apiVersion: catalog.swiss/v1
name: glm-5.3-flash
version: 1.0.2
servedName: glm-5.3-flash
variants:
  - id: sglang-tp8-h100-uncensored-fp8
    default: true
    description: >-
      TP8 on eight H100 GPUs, single node, uncensored FP8 weights, with
      multimodal video input enabled (fps 2 sampling).
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.20-video
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      # The FP8 kernels in this build need driver 610.43.02 (NVIDIA-SMI).
      # Pin scheduling to nodes carrying that driver label.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/cuda.driver-version.full
                    operator: In
                    values:
                      - "610.43.02"
      model:
        localPath: /mnt/disk0/models/GLM-5.3-Flash-UNCENSORED-FP8
        mountPath: /model
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tp-size=8
        - --trust-remote-code
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.85
        - --reasoning-parser=glm45
        - --tool-call-parser=glm47
        - --enable-cache-report
        - --enable-metrics
        - --stream-response-default-include-usage
        - --enable-multimodal
        - '--mm-process-config={"video":{"fps":2}}'
        - --mm-processor-worker-num=4
        - --mm-io-worker-num=16
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        # The proxy values below come from the original deploy host. Replace
        # them with your own proxy address (and add internal hosts to
        # NO_PROXY), or drop all three if the pod has direct egress.
        - name: HTTP_PROXY
          value: http://172.24.4.56:8989
        - name: HTTPS_PROXY
          value: http://172.24.4.56:8989
        - name: NO_PROXY
          value: localhost,127.0.0.1,172.28.4.41
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
